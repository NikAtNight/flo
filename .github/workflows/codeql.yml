name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published queries reach existing code without a push.
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    # Swift analysis has to build the code, and this is an AppKit app.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Identify Swift toolchain
        id: toolchain
        shell: bash
        run: |
          sw_vers -productVersion > "$RUNNER_TEMP/codeql-toolchain.txt"
          xcodebuild -version >> "$RUNNER_TEMP/codeql-toolchain.txt"
          swift --version >> "$RUNNER_TEMP/codeql-toolchain.txt"
          fingerprint=$(shasum -a 256 "$RUNNER_TEMP/codeql-toolchain.txt" | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM dependencies
        id: dependencies
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          # This namespace contains dependency builds only. Never restore the
          # old full-app cache, which could hide unchanged files from CodeQL.
          # v2: the rename to flo moved the checkout path.
          key: ${{ runner.os }}-${{ runner.arch }}-codeql-deps-v2-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-codeql-deps-v2-${{ steps.toolchain.outputs.fingerprint }}-

      - name: Resolve SwiftPM dependencies
        run: swift package resolve

      - name: Build SwiftPM dependencies
        run: |
          swift build --target WhisperKit
          swift build --target FluidAudio

      # Save before the app builds so even an unchanged app is compiled under
      # CodeQL on the next run. Sparkle is a resolved binary dependency.
      - name: Save SwiftPM dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: swift build

      - name: Perform analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
